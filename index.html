<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      position: relative;
    }

    .icone-app {
      position: absolute;
      left: 20px;
      width: 130px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .icone-app img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      display: block;
      margin: 0 auto 2px auto;
    }

    .icone-app span {
      color: white;
      font-size: 14px;
      text-shadow: 1px 1px 3px black;
      display: block;
    }

    .menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
    }

    .menu.aberto {
      display: block;
    }

    .janela {
      position: relative;
      display: inline-block;
    }

    .janela img {
      width: auto;
      height: auto;
      max-width: 85vw;
      max-height: 85vh;
      display: block;
    }

    .area-fechar {
      position: absolute;
      top: 1.4%;
      right: 1.1%;
      width: 13%;
      height: 5.5%;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
    }
  </style>
</head>
<body>

  <div class="icone-app" style="top: 20px;" onclick="abrirMenu()">
    <img src="icone.png">
    <span>Sobre Mim</span>
  </div>

  <div class="icone-app" style="top: 130px;" onclick="abrirMenu()">
    <img src="icone1.png">
    <span>Meus Interesses</span>
  </div>

  <div class="icone-app" style="top: 240px;" onclick="abrirMenu()">
    <img src="icone2.png">
    <span>Meus Projetos</span>
  </div>

  <div class="icone-app" style="top: 350px;" onclick="abrirMenu()">
    <img src="icone3.png">
    <span>Links</span>
  </div>

  <div class="menu" id="menu">
    <div class="janela">
      <img src="menu.png">
      <button class="area-fechar" onclick="fecharMenu()"></button>
    </div>
  </div>

  <script>
    const backgrounds = [
      "colina.jpg",
      "montanha.jpg",
      "campo.jpg",
      "nuvens.jpg",
      "por_do_sol.jpg",
      "frutiger.jpg",
      "mar.jpg",
      "neve.jpg"
    ];

    const random = Math.floor(Math.random() * backgrounds.length);
    document.body.style.backgroundImage = `url(${backgrounds[random]})`;

    function abrirMenu() {
      document.getElementById("menu").classList.add("aberto");
    }

    function fecharMenu() {
      document.getElementById("menu").classList.remove("aberto");
    }
  </script>

</body>
</html>
