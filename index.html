<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      position: relative;
    }

    .icone-app {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 130px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .icone-app img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      display: block;
      margin: 0 auto 6px auto;
    }

    .icone-app span {
      color: white;
      font-size: 14px;
      text-shadow: 1px 1px 3px black;
      display: block;
    }

    .menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
    }

    .menu img {
      width: 80vw;
      max-width: 1200px;
      height: auto;
      max-height: 85vh;
      display: block;
    }

    .menu.aberto {
      display: block;
    }
  </style>
</head>
<body>

  <div class="icone-app" onclick="alternarMenu()">
    <img src="icone.png">
    <span>Sobre Mim</span>
  </div>

  <div class="menu" id="menu">
    <img src="menu.jpg">
  </div>

  <script>
    const backgrounds = [
      "colina.jpg",
      "montanha.jpg",
      "campo.jpg",
      "nuvens.jpg",
      "por_do_sol.jpg",
      "frutiger.jpg",
      "mar.jpg",
      "neve.jpg"
    ];

    const random = Math.floor(Math.random() * backgrounds.length);
    document.body.style.backgroundImage = `url(${backgrounds[random]})`;

    function alternarMenu() {
      const menu = document.getElementById("menu");
      menu.classList.toggle("aberto");
    }
  </script>

</body>
</html>
