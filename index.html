<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUCAS CORDEIRO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: "Courier New", Courier, monospace;
      min-height: 100vh;
      padding: 48px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 760px;
      border: 1px solid #fff;
      padding: 28px;
      background: #000;
      box-shadow: 0 0 0 1px #000, 0 0 24px rgba(255,255,255,0.06);
    }

    .topbar {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border: 1px solid #fff;
      border-radius: 50%;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;
      margin-bottom: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255,255,255,0.18);
    }

    .subtitle {
      color: #cfcfcf;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    .section {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px dashed #fff;
    }

    .label {
      display: block;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: #d9d9d9;
    }

    .prompt::before {
      content: "> ";
    }

    .about {
      white-space: pre-line;
      line-height: 1.8;
      color: #f3f3f3;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    a {
      color: #fff;
      text-decoration: none;
      width: fit-content;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease, opacity 0.15s ease;
    }

    a:hover {
      border-color: #fff;
      opacity: 0.85;
    }

    .footer {
      margin-top: 34px;
      color: #9a9a9a;
      font-size: 0.85rem;
    }

    .blink {
      display: inline-block;
      margin-left: 6px;
      animation: blink 1s steps(1, end) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      h1 {
        letter-spacing: 0.1em;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="topbar">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <header>
      <h1>LUCAS CORDEIRO</h1>
      <p class="subtitle">personal terminal page<span class="blink">_</span></p>
    </header>

    <section class="section">
      <span class="label prompt">about.txt</span>
      <p class="about">Hello. I am Lucas. A 21 year old currently majoring applied mathematics in University of São Paulo. My main interests are: Topology
      cryptography, linguistics, history of the middle east and 3D modeling.</p>
    </section>

    <section class="section">
      <span class="label prompt">links/</span>
      <div class="links">
        <a href="https://twitter.com/IoStracciatella" target="_blank" rel="noopener noreferrer">twitter</a>
        <a href="https://steamcommunity.com/profiles/76561199166174874/" target="_blank" rel="noopener noreferrer">steam</a>
      </div>
    </section>

    <footer class="footer">
      <p>status: online</p>
    </footer>
  </main>
</body>
</html>
