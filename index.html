<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site</title>
  <style>
    @font-face {
      font-family: "ComicSansLocal";
      src: url("COMICBD.TTF") format("truetype");
      font-weight: bold;
      font-style: normal;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Helvetica, Arial, sans-serif;
      font-weight: bold;
      position: relative;
    }

    .icone-app {
      position: absolute;
      left: 20px;
      width: 130px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .icone-app img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      display: block;
      margin: 0 auto 2px auto;
    }

    .icone-app span {
      color: white;
      font-size: 14px;
      text-shadow: 1px 1px 3px black;
      display: block;
    }

    .menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: block;
    }

    .janela {
      position: relative;
      display: inline-block;
    }

    .janela img {
      width: auto;
      height: auto;
      max-width: 85vw;
      max-height: 85vh;
      display: block;
    }

    .area-fechar {
      position: absolute;
      top: 1.4%;
      right: 1.1%;
      width: 13%;
      height: 5.5%;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .conteudo-menu {
      position: absolute;
      top: 12%;
      left: 4.5%;
      width: 90%;
      height: 80%;
      box-sizing: border-box;
      padding: 18px;
      overflow-y: auto;
      color: black;
      font-size: 22px;
      line-height: 1.5;
    }

    .conteudo-menu a {
      color: blue;
      text-decoration: underline;
    }

    .secao {
      margin-bottom: 25px;
    }

    .titulo-secao {
      font-size: 20px;
      margin-bottom: 8px;
      border-bottom: 2px solid black;
      display: inline-block;
      padding-bottom: 2px;
    }

    .inicio {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
    }

    .titulo-animado {
      font-family: "ComicSansLocal", "Comic Sans MS", "Comic Sans", cursive;
      font-size: 60px;
      font-weight: bold;
      line-height: 1.1;
      white-space: nowrap;
    }

    .titulo-animado span {
      display: inline-block;
      animation: ondular 1.8s ease-in-out infinite;
    }

    .titulo-animado span:nth-child(1) { animation-delay: 0s; }
    .titulo-animado span:nth-child(2) { animation-delay: 0.08s; }
    .titulo-animado span:nth-child(3) { animation-delay: 0.16s; }
    .titulo-animado span:nth-child(4) { animation-delay: 0.24s; }
    .titulo-animado span:nth-child(5) { animation-delay: 0.32s; }
    .titulo-animado span:nth-child(6) { animation-delay: 0.40s; }
    .titulo-animado span:nth-child(7) { animation-delay: 0.48s; }
    .titulo-animado span:nth-child(8) { animation-delay: 0.56s; }
    .titulo-animado span:nth-child(9) { animation-delay: 0.64s; }
    .titulo-animado span:nth-child(10) { animation-delay: 0.72s; }
    .titulo-animado span:nth-child(11) { animation-delay: 0.80s; }
    .titulo-animado span:nth-child(12) { animation-delay: 0.88s; }
    .titulo-animado span:nth-child(13) { animation-delay: 0.96s; }
    .titulo-animado span:nth-child(14) { animation-delay: 1.04s; }

    @keyframes ondular {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-13px); }
    }

    .subtitulo {
      font-size: 20px;
      margin-top: 26px;
    }
  </style>
</head>
<body>

  <div class="icone-app" style="top: 20px;" onclick="abrirMenu('sobre')">
    <img src="icone.png">
    <span>Sobre Mim</span>
  </div>

  <div class="icone-app" style="top: 130px;" onclick="abrirMenu('interesses')">
    <img src="icone1.png">
    <span>Meus Interesses</span>
  </div>

  <div class="icone-app" style="top: 240px;" onclick="abrirMenu('projetos')">
    <img src="icone2.png">
    <span>Meus Projetos</span>
  </div>

  <div class="icone-app" style="top: 350px;" onclick="abrirMenu('links')">
    <img src="icone3.png">
    <span>Links</span>
  </div>

  <div class="menu" id="menu">
    <div class="janela">
      <img src="menu.png">
      <div class="conteudo-menu" id="conteudo-menu">
        <div class="inicio">
          <div class="titulo-animado">
            <span>L</span><span>U</span><span>C</span><span>A</span><span>S</span><span>&nbsp;</span><span>C</span><span>O</span><span>R</span><span>D</span><span>E</span><span>I</span><span>R</span><span>O</span>
          </div>
          <div class="subtitulo">Bem vindo ao meu site pessoal! :D</div>
        </div>
      </div>
      <button class="area-fechar" onclick="fecharMenu()"></button>
    </div>
  </div>

  <script>
    const backgrounds = [
      "colina.jpg","montanha.jpg","campo.jpg","nuvens.jpg",
      "por_do_sol.jpg","frutiger.jpg","mar.jpg","neve.jpg",
      "montanha_e_planicie.jpg", "colina_ceu.jpg"
    ];

    const random = Math.floor(Math.random() * backgrounds.length);
    document.body.style.backgroundImage = `url(${backgrounds[random]})`;

    const textos = {
      sobre: `Olá. Eu sou Lucas. Um estudante de matemática aplicada e computação científica na USP. Meu interesse por computação vem desde pequeno, quando eu aprendi a mexer no scratch. Além de computação, me interesso também por modelagem 3D, linguística, desenho, história do oriente médio e criptografia. Fiz esse site pra mostrar meu portfolio e outras coisas que eu achar interessantes! :)`,

      interesses: `
        <div class="secao">
          <div class="titulo-secao">Relacionado a matemática/computação</div><br>
          Topologia<br>
          Criptografia<br>
          Modelagem 3D
        </div>

        <div class="secao">
          <div class="titulo-secao">Gerais</div><br>
          História do Oriente médio<br>
          Linguística e Semântica Formal
        </div>
      `,

      projetos: `Estou trabalhando em um jogo eletrônico educacional para o CDCC USP, feito na engine do Roblox. O projeto está sendo feito em conjunto com meu amigo.`,

      links: `
        Minhas redes sociais<br><br>
        <a href="https://github.com/IoStracciatella/" target="_blank">Github</a><br>
        <a href="https://www.linkedin.com/in/lucas-cordeiro-21b6a22b6/" target="_blank">LinkedIn</a><br>
        <a href="https://x.com/IoStracciatella" target="_blank">Twitter</a><br>
        <a href="https://www.deviantart.com/iostracciatella" target="_blank">DeviantArt</a><br>
        <a href="https://sketchfab.com/IoStracciatella" target="_blank">Sketchfab</a>
      `
    };

    function abrirMenu(tipo) {
      document.getElementById("conteudo-menu").innerHTML = textos[tipo];
      document.getElementById("menu").style.display = "block";
    }

    function fecharMenu() {
      document.getElementById("menu").style.display = "none";
    }
  </script>

</body>
</html>
