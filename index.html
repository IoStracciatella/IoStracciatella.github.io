<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background-image: url("colina.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      position: relative;
    }

    .icone-app {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 110px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .icone-app img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      display: block;
      margin: 0 auto 6px auto;
    }

    .icone-app span {
      color: white;
      font-size: 14px;
      text-shadow: 1px 1px 3px black;
      display: block;
    }

    .menu {
      position: absolute;
      top: 100px;
      left: 20px;
      display: none;
    }

    .menu img {
      width: 300px;
      max-width: 90vw;
      height: auto;
      display: block;
    }

    .menu.aberto {
      display: block;
    }
  </style>
</head>
<body>

  <div class="icone-app" onclick="alternarMenu()">
    <img src="icone.png">
    <span>Meu App</span>
  </div>

  <div class="menu" id="menu">
    <img src="menu.jpg">
  </div>

  <script>
    function alternarMenu() {
      const menu = document.getElementById("menu");
      menu.classList.toggle("aberto");
    }
  </script>

</body>
</html>
